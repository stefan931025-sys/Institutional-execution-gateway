name: Institutional Gateway CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Dependencies & Quality Tools
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio pytest-cov prometheus-client flake8 mypy bandit

      - name: Run Linting (Flake8)
        run: |
          flake8 src/ tests/ --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run Type Checking (Mypy)
        run: |
          mypy src/ --ignore-missing-imports

      - name: Start Exchange Simulator (Background)
        run: |
          # Start background mock exchange if applicable, or skip if handled by tests

      - name: Run Institutional Execution Gateway
        run: |
          export PYTHONPATH=.
          python main.py --ci

      - name: Run Pytest
        run: |
          export PYTHONPATH=.
          pytest tests/ --cov=. --cov-report=term-missing
