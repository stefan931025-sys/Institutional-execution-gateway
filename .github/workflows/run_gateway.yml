name: Run Institutional Gateway

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  execute-gateway:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Locate and Run main.py
        run: |
          echo "Searching for main.py in the workspace:"
          find . -name "main.py"
          
          # Dynamically find the file path and run it
          MAIN_PATH=$(find . -name "main.py" | head -n 1)
          if [ -z "$MAIN_PATH" ]; then
            echo "Error: main.py could not be found anywhere in the repository!"
            exit 1
          fi
          
          echo "Executing found script at: $MAIN_PATH"
          python "$MAIN_PATH"
