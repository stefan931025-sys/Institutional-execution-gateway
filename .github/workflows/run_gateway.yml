name: Run Institutional Gateway

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  execute-gateway:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Start Exchange Simulator (Background)
      run: |
        python exchange_simulator.py &
        for i in {1..10}; do
          nc -z localhost 9800 && break
          sleep 1
        done

    - name: Run Institutional Execution Gateway
      env:
        FIX_SERVER_HOST: ${{ secrets.FIX_SERVER_HOST || 'localhost' }}
      run: |
        timeout 15 python main.py || true
