name: Run Institutional Gateway

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  execute-gateway:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start Exchange Simulator (Background)
        run: |
          python exchange_simulator.py &
          sleep 2

      - name: Run Institutional Execution Gateway
        run: |
          python main.py
