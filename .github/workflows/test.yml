name: CI & Quality Checks

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install Dependencies & Quality Tools
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        pip install pytest flake8 mypy bandit numpy pandas scipy statsmodels

    - name: Run Linting (Flake8)
      run: |
        # Allow exit-zero so style warnings don't break the build
        flake8 --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Run Type Checking (Mypy)
      run: |
        # Ignore missing imports for scientific libraries lacking stubs
        mypy src --ignore-missing-imports || true

    - name: Run Security Scan (Bandit)
      run: |
        # Scan code for security issues without failing the pipeline on low-severity notes
        bandit -r . -ll || true

    - name: Run Pytest
      run: |
        pytest -v
