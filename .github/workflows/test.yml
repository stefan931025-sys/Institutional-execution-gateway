name: CI & Quality Checks

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install Dependencies & Quality Tools
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        pip install pytest flake8 mypy bandit numpy pandas scipy statsmodels

    - name: Run Linting (Flake8)
      run: |
        flake8 --count --select=E9,F63,F7,F82 --show-source --statistics || true

    - name: Run Type Checking (Mypy)
      run: |
        mypy src --ignore-missing-imports || true

    - name: Run Security Scan (Bandit)
      run: |
        bandit -r . -ll || true

    - name: Run Pytest
      run: |
        export PYTHONPATH=src:.
        if [ -d "tests" ]; then pytest -v --tb=short; else echo "No tests directory found, skipping safely."; exit 0; fi
